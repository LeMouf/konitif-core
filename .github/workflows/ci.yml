name: Core validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Exact checkout revision observed in the successful baseline CI.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select cached publishing-compatible runtime
        run: bash scripts/select-ci-runtime.sh
      - name: Install locked build dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - name: Check distributable
        run: npm run verify:package
