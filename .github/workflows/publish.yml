name: Publish Core

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: core-npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'LeMouf/konitif-core' && vars.CORE_NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require tag on main history
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Select cached publishing-compatible runtime
        run: bash scripts/select-ci-runtime.sh
      - run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - run: npm run build
      - run: npm test
      - run: node scripts/check-release.mjs
      - name: Verify exact archive to publish
        run: npm run verify:package
        env:
          CORE_RELEASE_ARCHIVE: 'true'
      - name: Publish verified archive through npm OIDC
        run: npm publish .release/core.tgz --access public --provenance --ignore-scripts --registry=https://registry.npmjs.org
